name: Build & push Docker image

on:
  push:
    branches: [main, staging]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bepaal image-tags op basis van de branch
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tags=ghcr.io/jayvenco/boekhoud:latest,ghcr.io/jayvenco/boekhoud:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/jayvenco/boekhoud:staging,ghcr.io/jayvenco/boekhoud:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
