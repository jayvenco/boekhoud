<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen – Mondschoon Boekhouding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #8B6F4E; --green-pale: #EAF2EC; --green-light: #A8C5B0;
      --cream: #FAF8F5; --border: #E2D9CE; --dark: #2A2520; --mid: #524840;
      --warm-gray: #9E9187; --danger: #B85450; --danger-light: #FAEDEC;
    }
    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
    }
    .login-wrap {
      display: grid;
      grid-template-columns: 1fr 400px;
      min-height: 100vh;
      width: 100%;
    }
    .login-art {
      background: linear-gradient(150deg, #A68560 0%, #8B6F4E 45%, #6F5539 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .login-art::before {
      content: '';
      position: absolute;
      width: 480px; height: 480px;
      background: rgba(255,255,255,0.07);
      border-radius: 50%;
      top: -120px; left: -160px;
    }
    .login-art::after {
      content: '';
      position: absolute;
      width: 280px; height: 280px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      bottom: -60px; right: -70px;
    }
    .art-text { text-align: center; z-index: 1; color: white; padding: 40px; }
    .art-logo {
      margin-bottom: 28px;
    }
    .art-logo img {
      max-height: 160px;
      max-width: 200px;
      object-fit: contain;
      border-radius: 16px;
    }
    .form-logo img {
      max-height: 64px;
      max-width: 130px;
      object-fit: contain;
      margin-bottom: 10px;
      display: block;
      border-radius: 10px;
    }
    .art-title {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
    }
    .art-sub { font-size: 15px; opacity: 0.75; font-weight: 300; line-height: 1.6; }
    .login-form-wrap {
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      border-left: 1px solid var(--border);
    }
    .login-box { width: 100%; max-width: 300px; }
    .login-logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .login-tagline { font-size: 13px; color: var(--warm-gray); margin-bottom: 32px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: var(--mid); margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 12px;
      font-family: inherit; font-size: 13.5px;
      border: 1px solid var(--border); border-radius: 7px;
      color: var(--dark); background: white;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(139,111,78,0.12);
    }
    .btn-login {
      width: 100%; padding: 11px;
      background: var(--green); color: white;
      border: none; border-radius: 7px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
      margin-top: 6px; letter-spacing: 0.01em;
    }
    .btn-login:hover { background: #7A5E3F; }
    .alert {
      padding: 11px 13px;
      background: var(--danger-light); color: var(--danger);
      border-radius: 7px; font-size: 13px; margin-bottom: 18px;
      border: 1px solid #E8B4AF;
    }
    @media (max-width: 700px) {
      .login-wrap { grid-template-columns: 1fr; }
      .login-art { display: none; }
      .login-form-wrap { padding: 40px 24px; }
    }
  </style>
</head>
