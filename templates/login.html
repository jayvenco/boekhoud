<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inloggen – Boekhoud App V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--royal:#1a3a6b;--accent:#e8833a;--danger:#dc2626;--border:#e5e7eb;}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1a3a6b 0%,#0f2548 50%,#e8833a 150%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:1.5rem;font-weight:800;color:var(--royal);letter-spacing:-.5px;margin-bottom:4px}
.logo span{color:var(--accent)}
.subtitle{color:#6b7280;font-size:.83rem;margin-bottom:32px}
label{display:block;font-size:.72rem;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:.9rem;color:#1c2333;margin-bottom:16px;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff}
input:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(26,58,107,.1)}
button{width:100%;padding:12px;background:var(--royal);color:#fff;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .15s;letter-spacing:.01em}
button:hover{background:#243f7a}
.flash{padding:10px 14px;border-radius:8px;font-size:.82rem;margin-bottom:18px;font-weight:500;background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Boek<span>houd</span> V3</div>
  <div class="subtitle">Financieel overzicht voor uw onderneming</div>
  {% for cat,msg in get_flashed_messages(with_categories=true) %}
  <div class="flash">{{msg}}</div>
  {% endfor %}
  <form method="POST" action="{{ url_for('login') }}">
    <label for="gn">Gebruikersnaam</label>
    <input type="text" id="gn" name="gebruikersnaam" autocomplete="username" required autofocus>
    <label for="pw">Wachtwoord</label>
    <input type="password" id="pw" name="wachtwoord" autocomplete="current-password" required>
    <button type="submit">Inloggen →</button>
  </form>
</div>
</body>
</html>
