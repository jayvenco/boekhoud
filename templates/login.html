<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen – Boekhoud App V3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1a2e;
    --accent: #e8833a;
    --accent2: #4a90d9;
    --surface: #ffffff;
    --muted: #6b7280;
    --border: #e5e7eb;
    --error: #dc2626;
    --success: #16a34a;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--surface);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .logo span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 36px; }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--ink); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
  input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    margin-bottom: 20px;
    transition: border-color 0.2s;
    outline: none;
  }
  input:focus { border-color: var(--accent2); }
  button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: #d4732e; }
  button:active { transform: scale(0.98); }
  .flash { padding: 10px 14px; border-radius: 8px; font-size: 0.875rem; margin-bottom: 20px; }
  .flash.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Boek<span>houd</span></div>
  <div class="subtitle">Financieel overzicht voor uw onderneming</div>

  {% for cat, msgs in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ cat }}">{{ msgs }}</div>
  {% endfor %}

  <form method="POST" action="{{ url_for('login') }}">
    <label for="gebruikersnaam">Gebruikersnaam</label>
    <input type="text" id="gebruikersnaam" name="gebruikersnaam" autocomplete="username" required autofocus>
    <label for="wachtwoord">Wachtwoord</label>
    <input type="password" id="wachtwoord" name="wachtwoord" autocomplete="current-password" required>
    <button type="submit">Inloggen</button>
  </form>
</div>
</body>
</html>
