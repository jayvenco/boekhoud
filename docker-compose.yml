services:
  setup:
    image: python:3.12-slim
    container_name: boekhoud-setup
    working_dir: /app
    command: >
      bash -c "
      echo '' | base64 -d | tar -xz -C /app &&
      echo 'Bestanden geïnstalleerd'"
    volumes:
      - boekhoud_code:/app
    restart: "no"

  app:
    image: python:3.12-slim
    container_name: boekhoud-app
    working_dir: /app
    command: >
      bash -c "
      apt-get update -q && apt-get install -y -q tesseract-ocr tesseract-ocr-nld tesseract-ocr-eng libmagic1 poppler-utils curl &&
      pip install -q --no-cache-dir fastapi 'uvicorn[standard]' sqlalchemy aiosqlite jinja2 python-multipart 'passlib[bcrypt]' itsdangerous starlette pdfplumber pillow pytesseract openai httpx apscheduler python-magic aiofiles openpyxl &&
      uvicorn main:app --host 0.0.0.0 --port 5000 --workers 1"
    ports:
      - "7777:5000"
    volumes:
      - boekhoud_code:/app
      - /mnt/user/appdata/boekhoud/data:/app/data
      - /mnt/user/appdata/boekhoud/uploads:/app/uploads
      - /mnt/user/appdata/boekhoud/backups:/app/backups
    environment:
      - SECRET_KEY=changeme-gebruik-een-sterk-wachtwoord
      - OPENAI_API_KEY=
      - OLLAMA_BASE_URL=
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - BACKUP_DIR=/app/backups
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://192.168.2.200:7777/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  boekhoud_code:
