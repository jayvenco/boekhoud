services:
  app:
    build: .
    container_name: boekhoud-app
    ports:
      - "5000:5000"
    volumes:
      - /mnt/user/appdata/boekhoud/data:/app/data
      - /mnt/user/appdata/boekhoud/uploads:/app/uploads
      - /mnt/user/appdata/boekhoud/backups:/app/backups
    environment:
      - SECRET_KEY=${SECRET_KEY:-changeme-use-a-strong-secret-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://192.168.2.200:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
