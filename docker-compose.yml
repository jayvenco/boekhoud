services:
  boekhoud:
    build:
      # Code wordt direct van GitHub gehaald en gebouwd
      context: https://github.com/jayvenco/boekhoud.git
      dockerfile: Dockerfile
    container_name: boekhoud-app
    ports:
      - "7777:5000"
    volumes:
      - /mnt/user/appdata/boekhoud/data:/app/data
      - /mnt/user/appdata/boekhoud/uploads:/app/uploads
      - /mnt/user/appdata/boekhoud/backups:/app/backups
      - /mnt/user/appdata/boekhoud/logs:/app/logs
    environment:
      # Verander dit naar een willekeurige geheime string
      - SECRET_KEY=verander-dit-naar-een-geheime-sleutel
      # Optioneel: vul in als je OpenAI OCR wilt gebruiken
      - OPENAI_API_KEY=
      # Optioneel: vul in als je een lokale Ollama-instantie hebt
      - OLLAMA_BASE_URL=
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - BACKUP_DIR=/app/backups
      - LOG_DIR=/app/logs
    restart: unless-stopped
