version: "3.9"

services:
  boekhoud_app:
    build: .
    container_name: boekhoud_app_v3
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=your_openai_api_key
      - SECRET_KEY=vervang_dit_met_een_lange_willekeurige_string
      - FLASK_ENV=production
    volumes:
      # Persistente opslag buiten de container
      - boekhoud_data:/app/data
      - boekhoud_uploads:/app/uploads
      - boekhoud_backups:/app/backups
    restart: unless-stopped
    # Veiligheid: beperk systeemrechten
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

volumes:
  boekhoud_data:
  boekhoud_uploads:
  boekhoud_backups:
